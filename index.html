<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Clock</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f9fafb;
    }
    .clock {
      text-align: center;
      padding: 48px;
    }
    .mtime {
      font-size: 5rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      color:rgb(225, 225, 99)
    }
    .gtime {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
    }
    #date {
      margin-top: 12px;
      font-size: clamp(1rem, 3vw, 1.5rem);
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <main class="clock">
    <div id="time" class="mtime" aria-live="polite">00:00:00</div>
    <div id="intime" class="gtime" aria-live="polite">00:00:00</div>
    <div id="date"></div>
  </main>

  <script>
    function updateClock() {
      const now = new Date();

      const time = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });

      const inTime = now.toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
        timeZone: "Asia/Kolkata"
      });

      const date = now.toLocaleDateString([], {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });

      document.getElementById("time").textContent = inTime;
      document.getElementById("intime").textContent = time;
      document.getElementById("date").textContent = date;
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
