<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Feed: JS & CSS Tips</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f4f9; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .feed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { font-size: 1.1rem; margin-top: 0; color: #333; }
        .card p { font-size: 0.9rem; color: #666; line-height: 1.4; }
        .card a { text-decoration: none; color: #007bff; font-weight: bold; font-size: 0.85rem; }
        .loader { text-align: center; padding: 20px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h2>Developer Tips Feed</h2>
    <div id="feeds" class="feed-grid">
        <div class="loader">Fetching latest insights...</div>
    </div>
</div>

<script>
    const FEEDS = [
        'https://css-tricks.com/feed/',
        'https://web.dev/blog/feed.xml',
        'https://v8.dev/blog.atom'
    ];

    async function fetchFeeds() {
        const feedContainer = document.getElementById('feeds');
        feedContainer.innerHTML = '';

        for (const url of FEEDS) {
            try {
                const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`);
                const data = await response.json();

                data.items.slice(0, 3).forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                            <h3>${item.title}</h3>
                            <p>${item.description.replace(/<[^>]*>?/gm, '').substring(0, 120)}...</p>
                            <a href="${item.link}" target="_blank">Read Article →</a>
                        `;
                    feedContainer.appendChild(card);
                });
            } catch (error) {
                console.error("Error fetching feed:", error);
            }
        }
    }

    fetchFeeds();
</script>
</body>
</html>
